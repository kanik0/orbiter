name: Release

on: 
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: 2024.1.0
        description: Release tag. Recommended format year.month.version

run-name: Release ${{ inputs.version }}

permissions:
  actions: read
  contents: write

# This is an experimental macOS / Apple Silicon port of Orbiter. Releases
# from this fork ship the macOS arm64 .dmg only — Windows builds remain
# the upstream orbitersim/orbiter project's responsibility. On-push macOS
# builds are handled by on-push-macos.yml; this workflow is the tagged /
# versioned equivalent for making dated public releases.

jobs:
  build-macos:
    name: Build macOS arm64
    uses: ./.github/workflows/reusable-build-macos.yml
    with:
      configuration: release
      smoke: true
      upload: true
      dmg: true

  package:
    name: Package
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Orbiter-macos-arm64-release-dmg
        path: Orbiter-macos-arm64

    - run: mv Orbiter-macos-arm64/Orbiter-macos-arm64.dmg Orbiter-macos-arm64.dmg

    - name: "Create release"
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        prerelease: false
        make_latest: true
        target_commitish: ${{ github.sha }}
        name: Orbiter macOS ${{ inputs.version }}
        body: |
          Experimental macOS / Apple Silicon build of Orbiter.

          Download `Orbiter-macos-arm64.dmg` and open it on an Apple
          Silicon Mac. For Windows builds, see the upstream project at
          https://github.com/orbitersim/orbiter.
        files: |
          Orbiter-macos-arm64.dmg
